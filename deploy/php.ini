; Ajustes de producción para Teatro (se suman a php.ini-production).

; No revelar la versión de PHP.
expose_php = Off

; Los errores nunca se muestran; van al log del contenedor (docker logs teatro-php).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Límites acotados: la aplicación solo recibe formularios pequeños.
post_max_size = 64K
upload_max_filesize = 0
file_uploads = Off
max_input_vars = 100
memory_limit = 64M
max_execution_time = 15

; Sesiones: solo por cookie y en modo estricto.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

; Funciones que la aplicación no usa y que un atacante aprovecharía.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
allow_url_fopen = Off
allow_url_include = Off
