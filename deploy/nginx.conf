# Nginx de Teatro. Solo recibe tráfico del túnel de Cloudflare (el puerto está
# publicado únicamente en 127.0.0.1 del servidor).

server_tokens off;

# IP real del visitante: la envía Cloudflare. Solo se confía en ella si la
# petición llega desde el propio servidor (túnel) o la red de Docker.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# Límites por IP: navegación general y compras (evita que un script agote las entradas).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=compras:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /var/www/teatro;
    index index.php;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    error_page 429 /demasiadas-solicitudes.html;
    location = /demasiadas-solicitudes.html {
        root /usr/share/nginx/errores;
        internal;
    }

    # Nada interno es accesible desde fuera.
    location ~ /\.                         { return 404; }
    location ~ ^/(includes|database)(/|$)  { return 404; }
    location ~ \.(sql|md|example\.php)$    { return 404; }

    location = /comprar.php {
        limit_req zone=compras burst=10 nodelay;
        include /etc/nginx/teatro-fastcgi.conf;
    }

    location ~ ^/(index|confirmacion)\.php$ {
        limit_req zone=general burst=30 nodelay;
        include /etc/nginx/teatro-fastcgi.conf;
    }

    # Solo las tres páginas públicas se ejecutan.
    location ~ \.php$ { return 404; }

    location /assets/ {
        limit_req zone=general burst=30 nodelay;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = / { rewrite ^ /index.php last; }

    location / { return 404; }
}
