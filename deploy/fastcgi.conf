fastcgi_pass teatro-php:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/teatro$fastcgi_script_name;
fastcgi_param SCRIPT_NAME $fastcgi_script_name;
# El visitante siempre llega por HTTPS (Cloudflare): la cookie de sesión se marca Secure.
fastcgi_param HTTPS on;
# Protección contra httpoxy.
fastcgi_param HTTP_PROXY "";
