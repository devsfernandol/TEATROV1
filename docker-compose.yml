# Teatro en producción con Docker: Nginx + PHP-FPM, más MySQL según el modo.
#
# Se instala con ./instalar.sh, que escribe el archivo .env. Este elige, con
# COMPOSE_FILE, cómo se conecta la aplicación a MySQL:
#   docker/mysql-docker.yml   MySQL nuevo en un contenedor (opción 1 del menú)
#   docker/mysql-socket.yml   MySQL instalado en este mismo servidor (opción 2)
#   (solo este archivo)       MySQL en otro servidor, por red (opción 2)
#
# Después de instalar funcionan los comandos habituales: docker compose ps, logs, restart...

name: teatro

services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${TEATRO_PUERTO:-8080}:80"
    volumes:
      - ./:/var/www/teatro:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/fastcgi.conf:/etc/nginx/teatro-fastcgi.conf:ro
      - ./docker/demasiadas-solicitudes.html:/usr/share/nginx/errores/demasiadas-solicitudes.html:ro
    depends_on:
      - php
    networks:
      - frontal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  php:
    build: ./docker
    image: teatro-php
    restart: unless-stopped
    environment:
      TEATRO_DB_HOST: ${TEATRO_DB_HOST:-db}
      TEATRO_DB_PORT: ${TEATRO_DB_PORT:-3306}
      TEATRO_DB_SOCKET: ${TEATRO_DB_SOCKET:-}
      TEATRO_DB_NAME: TEATRO
      TEATRO_DB_USER: ${TEATRO_DB_USER:-teatro_app}
      TEATRO_DB_PASSWORD: ${TEATRO_DB_PASSWORD:?Falta la configuración. Ejecute ./instalar.sh}
      TEATRO_LIMITE_ENTRADAS_COMPRADOR: ${TEATRO_LIMITE_ENTRADAS_COMPRADOR:-4}
      TEATRO_LIMITE_COMPRAS_IP: ${TEATRO_LIMITE_COMPRAS_IP:-20}
      TEATRO_LIMITE_CONSULTAS_IP: ${TEATRO_LIMITE_CONSULTAS_IP:-10}
    # Permite llegar a un MySQL publicado en este mismo servidor (host.docker.internal).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/var/www/teatro:ro
    networks:
      - frontal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  frontal: {}
