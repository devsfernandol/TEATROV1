# Nginx de Teatro: solo ejecuta las páginas públicas y sirve los estilos.
# Todo lo demás (includes/, database/, docker/, archivos .sql, .md, .env...) responde 404.

server_tokens off;

# Si hay un proxy inverso delante (para HTTPS), se toma la IP real del visitante
# que este envía. Solo se confía en el encabezado si viene de una red privada.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# La cookie de sesión se marca Secure cuando el visitante llega por HTTPS.
map $http_x_forwarded_proto $teatro_https {
    https   on;
    default "";
}

# Límites por IP: navegación general y compras (evita que un script agote las entradas).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=compras:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /var/www/teatro;
    index index.php;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    error_page 429 /demasiadas-solicitudes.html;
    location = /demasiadas-solicitudes.html {
        root /usr/share/nginx/errores;
        internal;
    }

    # Compras y consultas de entradas: límite más estricto.
    location ~ ^/(comprar|consultar)\.php$ {
        limit_req zone=compras burst=10 nodelay;
        include /etc/nginx/teatro-fastcgi.conf;
    }

    location ~ ^/(index|confirmacion)\.php$ {
        limit_req zone=general burst=30 nodelay;
        include /etc/nginx/teatro-fastcgi.conf;
    }

    location ^~ /assets/ {
        limit_req zone=general burst=30 nodelay;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = / { rewrite ^ /index.php last; }

    location / { return 404; }
}
